[build-system]
# 77 is where PEP 639 SPDX license metadata landed; without it the license field
# below is rejected rather than read.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Named `dubsmith`: `qwen-tts` belongs to the TTS checkpoint's own package, which
# is a *dependency* here. The public identity stays independent of one backend.
name = "dubsmith"
# Single-sourced from pipeline/__init__.py so the CLI, the package metadata and
# `dub.py --version` cannot disagree.
dynamic = ["version"]
authors = [{ name = "The Dubsmith authors" }]
maintainers = [{ name = "The Dubsmith authors" }]
description = "AI dubbing and expressive voice generation with local voice cloning."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "dubbing",
    "translation",
    "tts",
    "voice-cloning",
    "voice-design",
    "emotion",
    "whisper",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy==2.2.6",
    "typing_extensions",
    # Floor, not a pin: see the torch note in requirements.txt. Below 2.5 the
    # Qwen3-TTS decode path dies in transformers' sliding-window mask builder.
    "torch>=2.5.1",
    "soundfile",
    "librosa",
    "pydantic>=2.0",
    "qwen-tts",
    "faster-whisper",
    "huggingface-hub>=0.23",
    "pyloudnorm",
    "openai",
]

[project.urls]
Homepage = "https://github.com/tamanois/dubsmith"
Repository = "https://github.com/tamanois/dubsmith"
Issues = "https://github.com/tamanois/dubsmith/issues"
Documentation = "https://github.com/tamanois/dubsmith/blob/main/docs/README.md"
Changelog = "https://github.com/tamanois/dubsmith/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Every one of these degrades gracefully when absent, so they are extras rather
# than requirements: a single-voice dub of an audio file needs none of them.
background = ["demucs"]
diarization = ["funasr", "modelscope"]
separation = ["speechbrain"]
# GPU speech recognition: CTranslate2 links against CUDA 12 while recent torch
# wheels ship CUDA 13, and these wheels supply the missing libcublas/libcudnn.
# The pipeline preloads them itself, so no LD_LIBRARY_PATH is needed.
gpu-asr = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
full = ["demucs", "funasr", "modelscope", "speechbrain"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
    "funasr",
    "modelscope",
]

[project.scripts]
dub = "dub:main"
dub-audit-qc = "audit_qc:main"
dub-audit-timbre = "audit_timbre:main"

[tool.setuptools]
# Flat modules: the CLI entry points plus the importable pipeline package.
py-modules = ["dub", "audit_qc", "audit_timbre"]
packages = ["pipeline"]

[tool.setuptools.dynamic]
version = { attr = "pipeline.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "S", "A", "BLE"]
# E501: the codebase already contains long help strings and docs; formatting is
# a separate cleanup. B905: zip(strict=) is a Python 3.10+ style choice, not a
# correctness gate for this code yet. The remaining ignores are deliberate
# patterns (invariant asserts, best-effort cleanup, test probes).
ignore = [
    "E501",
    "B905",
    "S101",
    "B017",
    "A002",
    "SIM117",
    "SIM105",
    "S110",
    "E731",
    "B007",
    "B018",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.coverage.run]
source = ["pipeline", "dub", "audit_qc", "audit_timbre"]
omit = ["pipeline/*_worker.py"]
