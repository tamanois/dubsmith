name: CI

on:
  push:
  pull_request:

# A newer push makes an older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check .

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The documented floor, plus the versions between it and the current
        # release. The upper bound is enforced by requires-python.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The suite runs without a GPU, so the CPU wheel is both sufficient and
      # several gigabytes smaller than the CUDA build.
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Deliberately the *runtime* requirements: the optional backends (demucs,
      # funasr, speechbrain) are exercised through injected fakes and
      # `pytest.importorskip`, which is exactly how a user without them runs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" pytest-cov

      # `-o addopts=""` clears the `-q` in pyproject.toml, but must not clear
      # `--strict-markers`; pass it explicitly.
      - name: Run the test suite
        run: >
          pytest -o addopts="" --strict-markers
          --cov=pipeline --cov=dub --cov=audit_qc --cov=audit_timbre
          --cov-report=term-missing

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and smoke the CLI
        run: |
          pip install dist/*.whl
          dub --version
          dub --help

  docs:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments README.md docs CONTRIBUTING.md SECURITY.md CHANGELOG.md
